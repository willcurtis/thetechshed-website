<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 – Page Not Found | The Tech Shed</title>

  <!-- SEO Meta -->
  <meta name="description" content="404 Page Not Found – The Tech Shed"/>
  <meta name="robots" content="noindex"/>

  <!-- Favicons & Manifest -->
  <link rel="icon" href="favicon.ico"/>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#36f9b0"/>

  <style>
    :root {
      --bg-color: #0a0a0a;
      --text-color: #e0e0e0;
      --accent-color: #36f9b0;
      --focus-color: #ffff33;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: "Helvetica Neue", Arial, sans-serif;
      scroll-behavior: smooth;
    }
    a { color: var(--accent-color); text-decoration: none; }
    a:hover, a:focus { color: #fff; outline: none; }
    a:focus, button:focus {
      outline: 3px solid var(--focus-color);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute; top: -40px; left: 1rem;
      background: var(--accent-color); color: #000;
      padding: 0.5rem; z-index:10000;
      transition: top 0.3s;
    }
    .skip-link:focus { top: 1rem; }

    header {
      position: fixed; top:0; left:0; right:0;
      padding: 0.5rem 2rem;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(5px);
      display: flex; align-items:center; justify-content:space-between;
      z-index:1000;
    }
    .logo { display:flex; align-items:center; }
    .logo img { height:40px; margin-right:0.5rem; }
    .logo span {
      font-size:1.2rem; font-weight:600;
      letter-spacing:1px; color: var(--text-color);
    }
    nav[aria-label="Main"] a {
      margin:0 1rem; font-size:0.9rem; font-weight:500;
      position:relative;
    }
    nav[aria-label="Main"] a::after {
      content:""; position:absolute;
      left:0; right:0; bottom:-2px; height:2px;
      background: var(--accent-color);
      transform: scaleX(0); transform-origin:right;
      transition: transform 0.3s ease;
    }
    nav[aria-label="Main"] a:hover::after,
    nav[aria-label="Main"] a:focus::after {
      transform: scaleX(1); transform-origin:left;
    }

    .section-content {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1rem;
    }

    main { margin-top: 80px; }
    section {
      padding:100px 20px; min-height:100vh;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; scroll-margin-top:80px;
    }

    h1 { font-size:3rem; margin-bottom:1rem; color:#fff; }
    p { font-size:1.1rem; color:#bbb; margin-bottom:2rem; }
    .highlight { color: var(--accent-color); }

    footer {
      padding:20px; font-size:0.8rem;
      color:#555; text-align:center;
    }

    @media(max-width:768px) {
      header { flex-direction:column; }
      nav[aria-label="Main"] { margin-top:0.5rem; }
      section { padding:80px 20px; }
      h1 { font-size:2.2rem; }
      p { font-size:1rem; }
    }
  </style>
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <header role="banner">
    <div class="logo">
      <img src="thetechshed-round-600x600.png" alt="The Tech Shed Logo"/>
      <span>The Tech Shed</span>
    </div>
    <nav aria-label="Main">
      <a href="index.html#hero">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main id="main" role="main">
    <section id="not-found">
      <div class="section-content">
        <h1>404 – Page Not Found</h1>
        <p>Oops! The page you’re looking for doesn’t exist or has been moved.</p>
        <a href="index.html" class="highlight">Return to Home</a>
      </div>
    </section>
  </main>

  <footer role="contentinfo">
    &copy; 2025 The Tech Shed. All rights reserved.
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .catch(err => console.error('SW registration failed:', err));
    }
  </script>
</body>
</html>
